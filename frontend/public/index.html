<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>WB系统工具</title>
  <script src="/lib/react.min.js"></script>
  <script src="/lib/react-dom.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; }
    .header { background: #001529; color: #fff; padding: 0 24px; display: flex; align-items: center; height: 56px; justify-content: space-between; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 16px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #333; }
    .drop-zone { border: 2px dashed #d9d9d9; border-radius: 8px; padding: 28px; text-align: center; background: #fafafa; cursor: pointer; transition: all .3s; }
    .drop-zone:hover { border-color: #1677ff; background: #f0f5ff; }
    .drop-icon { font-size: 36px; color: #1677ff; margin-bottom: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 4px; padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; transition: all .3s; text-decoration: none; white-space: nowrap; }
    .btn-primary { background: #1677ff; color: #fff; }
    .btn-primary:hover { background: #4096ff; }
    .btn-success { background: #52c41a; color: #fff; }
    .btn-success:hover { background: #73d13d; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    input[type="file"] { display: none; }
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .file-tag { display: inline-block; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 4px; padding: 3px 8px; font-size: 12px; margin-top: 8px; color: #52c41a; }
    .param-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 16px; align-items: end; }
    .fetch-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
    .param-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .param-input { width: 100%; padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; text-align: center; }
    .param-input:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
    .date-input { width: 100%; padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
    .date-input:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
    .fetch-progress { background: #e6f4ff; border: 1px solid #91caff; border-radius: 6px; padding: 14px 16px; margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #1677ff; }
    .result-box { background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 6px; padding: 14px 16px; margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .result-box .msg { font-weight: 600; color: #52c41a; }
    .tab-bar { background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; padding: 0 16px; }
    .tab-item { padding: 12px 20px; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; transition: all .3s; user-select: none; }
    .tab-item:hover { color: #1677ff; }
    .tab-item.active { color: #1677ff; border-bottom-color: #1677ff; font-weight: 600; }
    .login-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: #fff; border-radius: 12px; padding: 40px 32px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,.15); text-align: center; }
    .login-box h2 { font-size: 20px; margin: 0 0 4px; }
    .login-box .sub { color: #999; font-size: 13px; margin-bottom: 24px; }
    .login-box .icon { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; color: #fff; }
    .login-input { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
    .login-input:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
    .login-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 15px; color: #fff; background: linear-gradient(135deg, #667eea, #764ba2); cursor: pointer; }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-err { color: #ff4d4f; font-size: 13px; margin-bottom: 12px; }
    .logout-btn { color: #fff; font-size: 13px; cursor: pointer; opacity: .7; padding: 4px 8px; }
    .logout-btn:hover { opacity: 1; }
    /* 上架库存 */
    .scan-input { width: 100%; padding: 14px 16px; font-size: 20px; border: 2px solid #1677ff; border-radius: 8px; text-align: center; letter-spacing: 1px; font-family: monospace; }
    .scan-input:focus { outline: none; box-shadow: 0 0 0 3px rgba(22,119,255,.2); }
    .btn-ghost { background: #f5f5f5; color: #333; }
    .btn-ghost:hover { background: #e8e8e8; }
    .scan-fb { margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .scan-fb.ok { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
    .scan-fb.bad { background: #fff1f0; border: 1px solid #ffa39e; color: #cf1322; }
    .inv-add-grid { display: grid; grid-template-columns: 1fr 1fr 120px auto; gap: 12px; align-items: end; }
    .inv-group-head { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
    .inv-table { width: 100%; border-collapse: collapse; }
    .inv-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .inv-table tr.inv-zero td { background: #fff1f0; }
    .inv-qty-input { width: 100%; padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; text-align: center; }
    .inv-qty-input:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
    .inv-del { color: #bbb; cursor: pointer; font-size: 16px; }
    .inv-del:hover { color: #ff4d4f; }
    .inv-add { display: inline-block; margin-left: 8px; width: 20px; height: 20px; line-height: 18px; text-align: center; border-radius: 50%; background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; font-weight: 700; cursor: pointer; font-size: 15px; vertical-align: middle; user-select: none; }
    .inv-add:hover { background: #52c41a; border-color: #52c41a; color: #fff; }
    .inv-edit { color: #999; cursor: pointer; font-size: 15px; margin-right: 10px; }
    .inv-edit:hover { color: #1677ff; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-box { background: #fff; border-radius: 10px; padding: 24px; width: 400px; max-width: 92vw; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #333; }
    .modal-hint { font-size: 13px; color: #555; background: #fafafa; border: 1px solid #f0f0f0; border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; line-height: 1.6; }
    .modal-row { margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .box-radio { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 6px; margin-bottom: 6px; cursor: pointer; transition: all .2s; }
    .box-radio:hover { border-color: #91caff; }
    .box-radio.active { border-color: #1677ff; background: #f0f7ff; }
    .box-radio input { width: 16px; height: 16px; cursor: pointer; flex: 0 0 auto; }
    .box-radio-code { font-family: monospace; font-size: 14px; font-weight: 600; color: #333; }
    .box-radio-qty { margin-left: auto; font-size: 12px; color: #888; white-space: nowrap; }
    .inv-th { text-align: left; font-size: 12px; color: #999; font-weight: 600; padding: 6px 10px; border-bottom: 1px solid #e8e8e8; }
    .inv-prod-cell { vertical-align: top; background: #fafafa; border-right: 1px solid #f0f0f0; padding: 10px 12px; }
    .inv-prod-name { font-size: 14px; font-weight: 600; color: #333; word-break: break-all; }
    .inv-prod-total { font-size: 12px; color: #1677ff; margin-top: 3px; }
    .inv-prod-zero { font-size: 11px; color: #cf1322; margin-top: 2px; }
    .inv-prod-defect { font-size: 11px; color: #d46b08; margin-top: 2px; }
    .inv-prod-sum { font-size: 11px; color: #666; margin-top: 2px; }
    .inv-qty-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .inv-qty-wrap .inv-qty-input { width: 84px; flex: 0 0 auto; }
    .inv-zero-tag { color: #cf1322; font-weight: 700; font-size: 12px; white-space: nowrap; flex: 0 0 auto; }
    .inv-batch-head { display: grid; grid-template-columns: 1fr 110px 1fr 24px; gap: 10px; font-size: 12px; color: #999; margin-bottom: 6px; }
    .inv-batch-row { display: grid; grid-template-columns: 1fr 110px 1fr 24px; gap: 10px; align-items: center; margin-bottom: 8px; }
    .inv-batch-row .param-input { width: 100%; }
    .box-batch-head { display: grid; grid-template-columns: 1fr 130px 24px; gap: 10px; font-size: 12px; color: #999; margin-bottom: 6px; }
    .box-batch-row { display: grid; grid-template-columns: 1fr 130px 24px; gap: 10px; align-items: center; margin-bottom: 8px; }
    .box-batch-row .param-input { width: 100%; }
    /* 操作日志 */
    .log-datebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .log-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 16px 0 4px; }
    .log-stat { border-radius: 8px; padding: 12px 14px; background: #fafafa; border: 1px solid #f0f0f0; text-align: center; }
    .log-stat .v { font-size: 24px; font-weight: 700; line-height: 1.2; color: #333; }
    .log-stat .l { font-size: 12px; color: #999; margin-top: 3px; }
    .log-stat.ship .v { color: #cf1322; }
    .log-stat.ret .v { color: #389e0d; }
    .log-stat.tr .v { color: #d46b08; }
    .log-stat.net .v { color: #1677ff; }
    .log-datechips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .log-chip { padding: 3px 10px; border-radius: 12px; background: #f0f5ff; color: #1677ff; font-size: 12px; cursor: pointer; border: 1px solid #d6e4ff; }
    .log-chip.active { background: #1677ff; color: #fff; border-color: #1677ff; }
    .log-chip:hover { border-color: #1677ff; }
    .log-type { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 10px; white-space: nowrap; }
    .log-type.ship { background: #fff1f0; color: #cf1322; }
    .log-type.ret { background: #f6ffed; color: #389e0d; }
    .log-type.tr { background: #fff7e6; color: #d46b08; }
    .log-delta { font-weight: 700; font-family: monospace; }
    .log-delta.neg { color: #cf1322; }
    .log-delta.pos { color: #389e0d; }
    .log-sec-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 10px; }
    @media (max-width: 768px) { .log-stats { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 768px) { .upload-grid { grid-template-columns: 1fr; } .param-grid { grid-template-columns: 1fr 1fr; } .fetch-grid { grid-template-columns: 1fr 1fr; } .inv-add-grid { grid-template-columns: 1fr 1fr; } .inv-batch-head, .inv-batch-row { grid-template-columns: 1fr 70px 1fr 22px; gap: 6px; } .container { padding: 8px; } .card { padding: 16px; } .tab-item { padding: 10px 12px; font-size: 13px; } }
  </style>
</head>
<body>
<div id="root"></div>
<script>
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;
var createRoot = ReactDOM.createRoot;
var API = '/api/v1';

function getToken() { return localStorage.getItem('wb_token'); }

function authFetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  var t = getToken();
  if (t) opts.headers['Authorization'] = 'Bearer ' + t;
  return fetch(url, opts).then(function(r){
    if (r.status === 401) { localStorage.removeItem('wb_token'); localStorage.removeItem('wb_user'); window.location.reload(); }
    return r;
  });
}

function LoginPage(props) {
  var S = useState(''), user = S[0], setUser = S[1];
  var S2 = useState(''), pass = S2[0], setPass = S2[1];
  var S3 = useState(false), loading = S3[0], setLoading = S3[1];
  var S4 = useState(''), err = S4[0], setErr = S4[1];

  function doLogin() {
    if (!user || !pass) { setErr('请输入用户名和密码'); return; }
    setLoading(true); setErr('');
    fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})})
      .then(function(r){return r.json().then(function(d){return {status:r.status,data:d};});})
      .then(function(r){
        if (r.status !== 200) { setErr(r.data.detail||'登录失败'); setLoading(false); return; }
        localStorage.setItem('wb_token', r.data.token);
        localStorage.setItem('wb_user', r.data.username);
        props.onLogin();
      }).catch(function(){setErr('网络错误');setLoading(false);});
  }

  return h('div',{className:'login-overlay'},
    h('div',{className:'login-box'},
      h('div',{className:'icon'},'📊'),
      h('h2',null,'WB系统工具'),
      h('div',{className:'sub'},'登录您的账号'),
      err ? h('div',{className:'login-err'},err) : null,
      h('input',{className:'login-input',type:'text',placeholder:'用户名',value:user,onChange:function(e){setUser(e.target.value);setErr('');}}),
      h('input',{className:'login-input',type:'password',placeholder:'密码',value:pass,onChange:function(e){setPass(e.target.value);setErr('');}}),
      h('button',{className:'login-btn',disabled:loading,onClick:doLogin},loading?'登录中...':'登 录')
    )
  );
}

function ManualTab(props) {
  var S1 = useState(false), processing = S1[0], setProcessing = S1[1];
  var S2 = useState(null), result = S2[0], setResult = S2[1];
  var S3 = useState([]), pfFiles = S3[0], setPfFiles = S3[1];
  var S4 = useState(null), puf = S4[0], setPuf = S4[1];
  var L1 = useState(false), pfl = L1[0], setPfl = L1[1];
  var L2 = useState(false), pufl = L2[0], setPufl = L2[1];
  var S5 = useState(''), uploadErr = S5[0], setUploadErr = S5[1];
  var r1 = useRef(null), r2 = useRef(null);
  var er = props.er, tr = props.tr, fr = props.fr;
  var setEr = props.setEr, setTr = props.setTr, setFr = props.setFr;

  function doUpload(f, type) {
    if(type==="platform")setPfl(true);else setPufl(true);
    var fd = new FormData();
    fd.append('file', f);
    fd.append('file_type', type);
    var hd = {}; var t = getToken(); if (t) hd['Authorization'] = 'Bearer '+t;
    fetch(API+'/reports/upload',{method:'POST',body:fd,headers:hd})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.status==='success'){
          if(type==='platform'){setPfFiles(function(arr){return arr.concat([f.name]);});}
          else setPuf(f.name);
        }
      })
      .catch(function(){if(type==='platform')setUploadErr('上传失败，请重试');})
      .finally(function(){if(type==='platform')setPfl(false);else setPufl(false);});
  }

  function onFile(e, type) {
    var files = e.target.files;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!f || !f.name.match(/\.(xlsx|xls)$/i)) continue;
      doUpload(f, type);
    }
    e.target.value = '';
  }

  function onProcess() {
    if (pfFiles.length < 1) return;
    setProcessing(true); setResult(null);
    var hd = {}; var t = getToken(); if (t) hd['Authorization'] = 'Bearer '+t;
    fetch(API+'/reports/process?exchange_rate='+er+'&tax_rate='+tr+'&fee_rate='+fr,{method:'POST',headers:hd})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.status==='success'){setResult(d);setPfFiles([]);setPuf(null);}
        setProcessing(false);
      })
      .catch(function(){setProcessing(false);});
  }

  return h('div',null,
    h('div',{className:'card'},
      h('div',{className:'card-title'},'📎 上传报表'),
      h('div',{className:'upload-grid'},
        h('div',null,
          h('div',{className:'drop-zone',onClick:function(){setUploadErr('');r1.current&&r1.current.click();}},
            pfl ? h('div',null,h('div',{style:{fontSize:28}},'⏳'),h('div',{style:{fontSize:14,marginTop:4,color:'#1677ff'}},'上传中...'))
               : pfFiles.length > 0
                 ? h('div',null,h('div',{style:{fontSize:28}},'📄'),h('div',{style:{fontSize:14,marginTop:4}},pfFiles.length+' 个平台报表'))
                 : h('div',null,h('div',{className:'drop-icon'},'📁'),h('div',{style:{fontSize:15,marginBottom:4}},'平台报表'),h('div',{style:{fontSize:12,color:'#999'}},'WB 俄语报表（可多选上传）')),
          ),
          h('input',{type:'file',ref:r1,accept:'.xlsx,.xls',multiple:true,style:{display:'none'},onChange:function(e){onFile(e,'platform');}}),
          pfFiles.length > 0 ? h('div',{style:{marginTop:8}},
            h('div',{className:'file-tag'},'✅ 已上传 '+pfFiles.length+' 个'),
            pfFiles.map(function(f){return h('div',{style:{fontSize:12,color:'#666',padding:'2px 4px'}},'📄 '+f);}))
          : null,
        uploadErr ? h('div',{style:{color:'#ff4d4f',fontSize:12,marginTop:4}},uploadErr) : null
        ),
        h('div',null,
          h('div',{className:'drop-zone',onClick:function(){r2.current&&r2.current.click();}},
            pufl ? h('div',null,h('div',{style:{fontSize:28}},'⏳'),h('div',{style:{fontSize:14,marginTop:4,color:'#1677ff'}},'上传中...'))
                : puf ? h('div',null,h('div',{style:{fontSize:28}},'📄'),h('div',{style:{fontSize:14,marginTop:4}},puf))
                : h('div',null,h('div',{className:'drop-icon'},'📋'),h('div',{style:{fontSize:15,marginBottom:4}},'采购文件'),h('div',{style:{fontSize:12,color:'#999'}},'品名/货本/头程/标签(₽)')),
          ),
          h('input',{type:'file',ref:r2,accept:'.xlsx,.xls',style:{display:'none'},onChange:function(e){onFile(e,'purchase');}}),
          puf ? h('div',{className:'file-tag'},'✅ '+puf) : null
        )
      )
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'⚙️ 处理参数'),
      h('div',{className:'param-grid'},
        h('div',null,h('div',{className:'param-label'},'汇率 (₽→¥)'),h('input',{className:'param-input',type:'number',step:'0.1',value:er,onChange:function(e){setEr(parseFloat(e.target.value)||0)}})),
        h('div',null,h('div',{className:'param-label'},'税率 (%)'),h('input',{className:'param-input',type:'number',step:'0.1',value:tr,onChange:function(e){setTr(parseFloat(e.target.value)||0)}})),
        h('div',null,h('div',{className:'param-label'},'手续费率 (%)'),h('input',{className:'param-input',type:'number',step:'0.1',value:fr,onChange:function(e){setFr(parseFloat(e.target.value)||0)}})),
        h('button',{className:'btn btn-primary',disabled:pfFiles.length<1||processing,onClick:onProcess,style:{padding:'8px 24px'}},
          processing ? '处理中...' : '处理 '+pfFiles.length+' 个')
      ),
      result ? h('div',{className:'result-box'},
        h('span',{className:'msg'},'✅ 处理完成！商品:'+(result.stats?.products||'')+' 销售:'+(result.stats?.sales_rows||'')),
        h('a',{className:'btn btn-success',href:result.download_url,target:'_blank'},'📥 下载')
      ) : null
    )
  );
}

function AutoFetchTab(props) {
  var S1 = useState(false), fetching = S1[0], setFetching = S1[1];
  var S2 = useState(''), startDate = S2[0], setStartDate = S2[1];
  var S3 = useState(''), endDate = S3[0], setEndDate = S3[1];
  var S4 = useState(null), fetchResult = S4[0], setFetchResult = S4[1];
  var er = props.er, tr = props.tr, fr = props.fr;
  var setEr = props.setEr, setTr = props.setTr, setFr = props.setFr;

  function onAutoFetch() {
    if (!startDate || !endDate) { alert('请选择日期范围'); return; }
    setFetching(true); setFetchResult(null);
    var fd = new FormData();
    fd.append('start_date', startDate);
    fd.append('end_date', endDate);
    fd.append('exchange_rate', String(er));
    fd.append('tax_rate', String(tr));
    fd.append('fee_rate', String(fr));
    var hd = {}; var t = getToken(); if (t) hd['Authorization'] = 'Bearer '+t;
    fetch(API+'/reports/fetch-auto',{method:'POST',body:fd,headers:hd})
      .then(function(r){return r.json().then(function(d){return {status:r.status,data:d};});})
      .then(function(r){
        if (r.status !== 200) throw new Error(r.data.detail||'请求失败');
        setFetchResult(r.data);
        setFetching(false);
      })
      .catch(function(e){alert('自动分析失败: '+e.message);setFetching(false);});
  }

  return h('div',null,

function InventoryTab(props) {
  var LG = useState(localStorage.getItem('wb_inv_lang') || 'zh'), lang = LG[0], setLang = LG[1];
  function setL(l){ setLang(l); try { localStorage.setItem('wb_inv_lang', l); } catch(e){} }
  var T = INV_T[lang] || INV_T.zh;
  var S1 = useState([]), items = S1[0], setItems = S1[1];
  var S2 = useState('ship'), mode = S2[0], setMode = S2[1];
  var S3 = useState(''), scanVal = S3[0], setScanVal = S3[1];
  var S4 = useState(null), fb = S4[0], setFb = S4[1];
  var S5 = useState(''), np = S5[0], setNp = S5[1];
  var S6 = useState([{id:'r0', code:'', qty:'', remark:''}]), rows = S6[0], setRows = S6[1];
  var S7 = useState(''), addErr = S7[0], setAddErr = S7[1];
  var S8 = useState(''), addOk = S8[0], setAddOk = S8[1];
  var S9 = useState(false), showAdd = S9[0], setShowAdd = S9[1];
  var S10 = useState(''), expErr = S10[0], setExpErr = S10[1];
  var S11 = useState(false), shipFromDefect = S11[0], setShipFromDefect = S11[1];
  var S12 = useState(null), rep = S12[0], setRep = S12[1];       // 调拨弹窗 {item, avail, qty}
  var S13 = useState(''), repErr = S13[0], setRepErr = S13[1];
  var S14 = useState(false), repBusy = S14[0], setRepBusy = S14[1];
  var S15 = useState(''), repMsg = S15[0], setRepMsg = S15[1];
  var scanRef = useRef(null);

  function load() {
    authFetch(API+'/inventory/items').then(function(r){return r.json();}).then(function(d){
      if (d && d.items) setItems(d.items);
    }).catch(function(){});
  }
  useEffect(function(){ load(); }, []);

  // 自动聚焦扫描框；页面任意位置按键都重定向到扫描框（配合扫描枪 HID）
  useEffect(function(){
    if (scanRef.current) scanRef.current.focus();
    function onKey(e){
      var tel = e.target, tag = (tel && tel.tagName || '').toLowerCase();
      if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
        if (scanRef.current && document.activeElement !== scanRef.current) scanRef.current.focus();
      }
    }
    document.addEventListener('keydown', onKey);
    return function(){ document.removeEventListener('keydown', onKey); };
  }, []);

  function doScan() {
    var code = (scanVal || '').trim();
    if (!code) return;
    var m = mode;
    var fdReq = (m === 'ship' && shipFromDefect);   // 发货开关：是否强制从次品库存扣
    setScanVal('');
    var url = API + (m === 'ship' ? '/inventory/ship' : '/inventory/return');
    authFetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code:code, from_defect:fdReq})})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        var ok = r.status === 200;
        var qty = ok ? (m==='ship' ? r.data.item.quantity : r.data.item.defective_quantity) : null;
        var msg;
        if (ok) msg = (m==='ship' ? T.shipOk : T.rtnOk);
        else if (r.status === 404) msg = T.notFound;
        else if (r.status === 400) msg = fdReq ? T.defectInsuff : T.insufficient;
        else msg = r.data.detail || T.failed;
        var fd = !!(ok && m==='ship' && r.data.from_defect);
        if (fd) qty = r.data.item.defective_quantity;
        setFb({ok:ok, code:code, qty:qty, msg:msg, mode:m, fromDefect:fd});
        if (ok) load();
        if (scanRef.current) scanRef.current.focus();
      })
      .catch(function(){ setFb({ok:false, code:code, msg:T.netErr, mode:m}); if (scanRef.current) scanRef.current.focus(); });
  }

  function newRow() { return {id: 'r' + Date.now() + '_' + Math.random(), code: '', qty: '', remark: ''}; }
  function setRow(id, field, val) {
    setRows(function(rs){ return rs.map(function(r){ if (r.id !== id) return r; var o = {}; for (var k in r) o[k] = r[k]; o[field] = val; return o; }); });
  }
  function addRow() { setRows(function(rs){ return rs.concat([newRow()]); }); }
  function delRow(id) { setRows(function(rs){ return rs.length > 1 ? rs.filter(function(r){ return r.id !== id; }) : rs; }); }

  function submitBatch() {
    setAddErr(''); setAddOk('');
    var items = rows
      .filter(function(r){ return (r.code || '').trim(); })
      .map(function(r){ return { code: (r.code || '').trim(), quantity: parseInt(r.qty, 10) || 0, remark: (r.remark || '').trim() }; });
    if (!items.length) { setAddErr(T.needCode); return; }
    authFetch(API+'/inventory/items/batch', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({product_name:(np||'').trim(), items:items})})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        if (r.status !== 200) { setAddErr(r.data.detail || T.failed); return; }
        if (r.data.status === 'conflict') { setAddErr(T.dupWarn + (r.data.conflicts || []).join('、')); return; }
        setAddOk(T.addOk(r.data.created));
        setNp('');
        setRows([newRow()]);
        load();
      })
      .catch(function(){ setAddErr(T.netErr); });
  }

  function saveQty(it, val) {
    var v = parseInt(val, 10); if (isNaN(v) || v < 0) v = 0;
    if (v === it.quantity) return;
    authFetch(API+'/inventory/items/'+it.id+'/quantity', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({quantity:v})})
      .then(function(r){ if (r.ok) load(); });
  }

  function saveDefect(it, val) {
    var v = parseInt(val, 10); if (isNaN(v) || v < 0) v = 0;
    if (v === (it.defective_quantity||0)) return;
    authFetch(API+'/inventory/items/'+it.id+'/defect', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({quantity:v})})
      .then(function(r){ if (r.ok) load(); });
  }

  function delItem(it) {
    if (!window.confirm(T.delPrep + it.code + T.delSuf)) return;
    authFetch(API+'/inventory/items/'+it.id+'/delete', {method:'POST'}).then(function(){ load(); });
  }

  // ── 从「箱子库存」调拨正品库存 ──
  function openReplenish(it) {
    setRepErr(''); setRepMsg('');
    setRep({item: it, boxes: null, avail: null, qty: '', selBoxId: null});
    // 预取箱子库存，列出含该型号的箱子（供用户选择）
    authFetch(API+'/boxes').then(function(r){return r.json();}).then(function(d){
      var code = (it.code || '').trim(), list = [], total = 0;
      ((d && d.boxes) || []).forEach(function(b){
        var q = 0;
        ((b.items) || []).forEach(function(bi){ if (((bi.product_model||'').trim()) === code) q += (bi.quantity || 0); });
        if (q > 0) { list.push({box_id: b.id, box_code: b.box_code, quantity: q}); total += q; }
      });
      var sel = (list.length === 1) ? list[0].box_id : null;   // 只有一个箱子时默认选中
      setRep(function(prev){
        if (!prev || prev.item.id !== it.id) return prev;
        return {item: it, boxes: list, avail: total, qty: prev.qty, selBoxId: (prev.selBoxId != null ? prev.selBoxId : sel)};
      });
    }).catch(function(){});
  }

  function confirmReplenish() {
    if (!rep) return;
    var v = parseInt(rep.qty, 10);
    if (isNaN(v) || v <= 0) { setRepErr(T.replenishNeedQty); return; }
    var sel = rep.selBoxId;
    if (sel == null && rep.boxes && rep.boxes.length === 1) sel = rep.boxes[0].box_id;
    if (sel == null && rep.boxes && rep.boxes.length > 1) { setRepErr(T.replenishNeedBox); return; }
    setRepBusy(true); setRepErr('');
    var body = {quantity: v};
    if (sel != null) body.box_id = sel;
    authFetch(API+'/inventory/items/'+rep.item.id+'/replenish', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        setRepBusy(false);
        if (r.status === 200) {
          setRepMsg(T.replenishOk(rep.item.code, r.data.added, r.data.box_code));
          setRep(null);
          load();
        } else if (r.status === 404) { setRepErr(T.replenishNotFound); }
        else if (r.status === 400) { setRepErr(T.replenishInsuff); }
        else { setRepErr((r.data && r.data.detail) || T.failed); }
      })
      .catch(function(){ setRepBusy(false); setRepErr(T.netErr); });
  }

  function exportExcel() {
    setExpErr('');
    authFetch(API+'/inventory/export').then(function(r){
      if (!r.ok) throw new Error('fail');
      return r.blob();
    }).then(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '上架库存_' + new Date().toISOString().slice(0,10) + '.xlsx';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }).catch(function(){ setExpErr(T.exportErr); });
  }

  var groups = {};
  items.forEach(function(it){ var k = it.product_name || T.ungrouped; if(!groups[k]) groups[k]=[]; groups[k].push(it); });
  var keys = Object.keys(groups);
  var totalGood = items.reduce(function(s,it){ return s + (it.quantity||0); }, 0);
  var totalDefect = items.reduce(function(s,it){ return s + (it.defective_quantity||0); }, 0);
  var totalAll = totalGood + totalDefect;
  var zeroCount = items.filter(function(it){ return (it.quantity||0) === 0; }).length;

  return h('div',null,
    // 语言切换
    h('div',{style:{display:'flex',justifyContent:'flex-end',alignItems:'center',gap:6,marginBottom:12}},
      h('span',{style:{fontSize:13,color:'#999'}},'🌐'),
      ['zh','ru'].map(function(L){
        return h('button',{key:L,className:'btn '+(lang===L?'btn-primary':'btn-ghost'),style:{padding:'4px 14px',fontSize:13},
          onClick:function(){ setL(L); }}, L==='zh' ? '中文' : 'Русский');
      })
    ),
    // 扫描操作
    h('div',{className:'card'},
      h('div',{className:'card-title'},T.scanTitle),
      h('div',{style:{display:'flex',gap:12,marginBottom:12}},
        h('button',{className:'btn '+(mode==='ship'?'btn-primary':'btn-ghost'),style:{flex:1,padding:'12px'},onClick:function(){setMode('ship');if(scanRef.current)scanRef.current.focus();}},T.ship),
        h('button',{className:'btn '+(mode==='return'?'btn-primary':'btn-ghost'),style:{flex:1,padding:'12px'},onClick:function(){setMode('return');if(scanRef.current)scanRef.current.focus();}},T.rtn)
      ),
      mode==='ship' ? h('label',{className:'defect-switch',style:{display:'flex',alignItems:'center',gap:8,marginBottom:12,cursor:'pointer',padding:'8px 12px',borderRadius:6,border:'1px solid '+(shipFromDefect?'#fa8c16':'#d9d9d9'),background:shipFromDefect?'#fff7e6':'#fafafa'}},
        h('input',{type:'checkbox',checked:shipFromDefect,onChange:function(e){setShipFromDefect(e.target.checked);if(scanRef.current)scanRef.current.focus();},style:{width:16,height:16,cursor:'pointer'}}),
        h('span',{style:{fontSize:13,fontWeight:600,color:shipFromDefect?'#d46b08':'#595959'}}, T.shipFromDefect)

  function load() {
    authFetch(API+'/boxes').then(function(r){return r.json();}).then(function(d){
      if (d && d.boxes) setBoxes(d.boxes);
    }).catch(function(){});
  }
  useEffect(function(){ load(); }, []);

  function newRow() { return {id: 'r' + Date.now() + '_' + Math.random(), model: '', qty: ''}; }
  function setRow(id, field, val) {
    setRows(function(rs){ return rs.map(function(r){ if (r.id !== id) return r; var o = {}; for (var k in r) o[k] = r[k]; o[field] = val; return o; }); });
  }
  function addRow() { setRows(function(rs){ return rs.concat([newRow()]); }); }
  function delRow(id) { setRows(function(rs){ return rs.length > 1 ? rs.filter(function(r){ return r.id !== id; }) : rs; }); }

  function submitBox() {
    setAddErr(''); setAddOk('');
    if (!(bc || '').trim()) { setAddErr(T.needCode); return; }
    var items = rows
      .filter(function(r){ return (r.model || '').trim(); })
      .map(function(r){ return { product_model: (r.model || '').trim(), quantity: parseInt(r.qty, 10) || 0 }; });
    if (!items.length) { setAddErr(T.needModel); return; }
    authFetch(API+'/boxes', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({box_code:(bc||'').trim(), remark:(brm||'').trim(), items:items})})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        if (r.status !== 200) { setAddErr(r.data.detail || T.failed); return; }
        setAddOk(T.addOk(r.data.box.box_code));
        setBc(''); setBrm(''); setRows([newRow()]);
        load();
      })
      .catch(function(){ setAddErr(T.netErr); });
  }

  function saveQty(b, it, val) {
    var v = parseInt(val, 10); if (isNaN(v) || v < 0) v = 0;

    authFetch(API+'/boxes/'+b.id+'/items/'+it.id+'/quantity', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({quantity:v})})
      .then(function(r){ if (r.ok) load(); });
  }

  function delBox(b) {
    if (!window.confirm(T.delPrep + b.box_code + T.delSuf)) return;

    setEditBox(function(p){ var o={}; for(var k in p) o[k]=p[k]; o.busy=true; o.err=''; return o; });
    authFetch(API+'/boxes/'+editBox.box.id+'/update', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({box_code: code, remark: (editBox.remark || '').trim()})})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        if (r.status === 200) { setEditBox(null); load(); }
        else { setEditBox(function(p){ var o={}; for(var k in p) o[k]=p[k]; o.busy=false; o.err=(r.data && r.data.detail) || T.failed; return o; }); }
      })
      .catch(function(){ setEditBox(function(p){ var o={}; for(var k in p) o[k]=p[k]; o.busy=false; o.err=T.netErr; return o; }); });
  }

function shiftDay(d, n) {
  var p = (d || '').split('-');
  if (p.length !== 3) return d;
  var dt = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  dt.setDate(dt.getDate() + n);
  return dt.getFullYear() + '-' + ('0'+(dt.getMonth()+1)).slice(-2) + '-' + ('0'+dt.getDate()).slice(-2);
}

function LogTab(props) {

  var T = LOG_T[lang] || LOG_T.zh;
  var S1 = useState(''), date = S1[0], setDate = S1[1];
  var S2 = useState(null), data = S2[0], setData = S2[1];

  var S4 = useState(''), err = S4[0], setErr = S4[1];

  function load(d) {
    setLoading(true); setErr('');
    var url = API + '/inventory/logs' + (d ? ('?date=' + encodeURIComponent(d)) : '');
    authFetch(url).then(function(r){ return r.json(); }).then(function(x){
      setData(x);
      if (x && x.date) setDate(x.date);
      setLoading(false);
    }).catch(function(){ setErr(T.loadErr); setLoading(false); });
  }
  useEffect(function(){ load(); }, []);

  function go(d){ load(d); }

    if (it.action !== 'transfer') return;
    if (!window.confirm(T.delLogConfirm(it.code, it.delta, it.box_code))) return;
    authFetch(API+'/inventory/logs/'+it.id+'/delete', {method:'POST'}).then(function(r){
      if (r.ok) { load(date); } else { window.alert(T.delLogFail); }

        h('button',{className:'btn btn-ghost',style:{padding:'6px 12px',fontSize:13},onClick:function(){go(today);}},T.todayBtn),
        h('button',{className:'btn btn-ghost',style:{padding:'6px 12px',fontSize:13},onClick:function(){go(shiftDay(date,1));}},T.nextBtn),

          )),

  var S3 = useState(8), tr = S3[0], setTr = S3[1];
  var S4 = useState(12), fr = S4[0], setFr = S4[1];

  var tabs = [
    {key:'inventory', label:'📦 上架库存'},

    {key:'logs', label:'📋 操作日志'},
    {key:'manual', label:'📎 手动处理'},

      tabs.map(function(t){

  );
}

function App() {
  var S = useState(null), loggedIn = S[0], setLoggedIn = S[1];
  var S2 = useState(false), checked = S2[0], setChecked = S2[1];

  useEffect(function(){
    var t = localStorage.getItem('wb_token');
    if (t) {
      var hd = {'Authorization':'Bearer '+t};
      fetch(API+'/auth/verify',{headers:hd}).then(function(r){
        if (r.ok) { setLoggedIn(true); } else { localStorage.removeItem('wb_token'); localStorage.removeItem('wb_user'); }
        setChecked(true);
      }).catch(function(){setChecked(true);});
    } else { setChecked(true); }
  }, []);

  if (!checked) return null;
  if (!loggedIn) return h(LoginPage,{onLogin:function(){setLoggedIn(true);}});
  return h(Page,{onLogout:function(){setLoggedIn(false);}});
}

createRoot(document.getElementById('root')).render(h(App));
