    deleteMsg: function(id){ return 'Удалить план поставки #'+id+'? План, короба и загруженные файлы будут удалены безвозвратно.'; },
    deleteYes: 'Удалить', deleteOk: '✅ Удалено',
    closeBtn: 'Закрыть', loading: 'Загрузка…',
    qtyExceed: function(avail){ return 'макс. '+avail; },
    sourceLabel: 'Код короба', addSourceBtn: '＋ Добавить код короба', removeSource: 'Удалить код',
    phSourceBox: 'Выберите код короба', cartonLabel: function(n){ return 'Короб '+n; }, sourcePrefix: 'Короб',
    needSourceQty: 'Укажите количество хотя бы по одному коробу', binLabel: 'Файлы поставки',
    outerCode: 'Внешний код короба', phOuterCode: 'Введите внешний код короба',
    filesTitle: 'Файлы поставки', addFilesBtn: '＋ Загрузить файлы поставки', filesHint: 'Можно несколько файлов',
    noFilesYet: 'Файлы поставки не загружены', filesDl: '⬇ Скачать',
    needOuterCode: 'Заполните внешний код для каждого короба', needFiles: 'Загрузите хотя бы один файл поставки'
  }
};

function DeliveryTab(props) {
  var LG = useState(localStorage.getItem('wb_inv_lang') || 'zh'), lang = LG[0], setLang = LG[1];
  function setL(l){ setLang(l); try { localStorage.setItem('wb_inv_lang', l); } catch(e){} }
  var T = DL_T[lang] || DL_T.zh;

  // 箱唛编码可能含换行/多余空格（Excel 导入残留），浏览器单行 input 会吞掉换行导致精确匹配失败。
  // dispCode：把任意空白折叠成单个空格（用于显示）；normCode：去掉全部空白（用于宽松匹配）。
  function dispCode(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }
  function normCode(s){ return String(s || '').replace(/\s+/g, ''); }
  function matchBoxByCode(val){
    var v = val || '';
    for (var i=0;i<boxesInv.length;i++){ if ((boxesInv[i].box_code||'') === v) return boxesInv[i]; }
    var dv = dispCode(v);
    for (var i2=0;i2<boxesInv.length;i2++){ if (dispCode(boxesInv[i2].box_code) === dv) return boxesInv[i2]; }
    var nv = normCode(v);
    if (nv) { for (var i3=0;i3<boxesInv.length;i3++){ if (normCode(boxesInv[i3].box_code) === nv) return boxesInv[i3]; } }
    return null;
  }

  var S1 = useState([]), plans = S1[0], setPlans = S1[1];
  var S2 = useState(true), loading = S2[0], setLoading = S2[1];
  var S3 = useState(''), err = S3[0], setErr = S3[1];
  var S4 = useState(''), okMsg = S4[0], setOkMsg = S4[1];
  var S5 = useState([]), boxesInv = S5[0], setBoxesInv = S5[1];      // 箱子库存（供选择）
  var S6 = useState(null), form = S6[0], setForm = S6[1];             // 表单状态（null=关闭）
  var S7 = useState(null), detail = S7[0], setDetail = S7[1];         // 查看清单弹窗
  var S8 = useState(null), outboundTarget = S8[0], setOutboundTarget = S8[1];
  var S9 = useState(false), busy = S9[0], setBusy = S9[1];
  var S10 = useState(null), deleteTarget = S10[0], setDeleteTarget = S10[1];

  function load() {
    setLoading(true); setErr('');
    authFetch(API+'/delivery/plans').then(function(r){return r.json();}).then(function(d){
      if (d && d.plans) {
        setPlans(d.plans);
        if (props && props.onCount) {
          props.onCount(d.plans.filter(function(p){ return (p.status||'') !== '已完成'; }).length);
        }
      }
      setLoading(false);
    }).catch(function(){ setErr(T.loadErr); setLoading(false); });
  }
  function loadBoxes() {
    authFetch(API+'/boxes').then(function(r){return r.json();}).then(function(d){
      if (d && d.boxes) setBoxesInv(d.boxes);
    }).catch(function(){});
  }
  useEffect(function(){ load(); loadBoxes(); }, []);

  // ── 打开创建/编辑表单 ──
  function openCreate() {
    setErr(''); setOkMsg('');
    setForm({ id:null, plan_date: new Date().toISOString().slice(0,10), station: '', remark: '',
              newFiles: [], existingFiles: [], boxes: [ newFormBox() ] });
  }
  function newFormSource() {
    return { sid: 's'+Date.now()+'_'+Math.random().toString(36).slice(2,7), box_id:'', box_code:'', items:{} };
  }
  function newFormBox() {
    return { key: 'b'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
             outer_code:'', filename:'', original_name:'', fileLabel:'', sources:[ newFormSource() ] };
  }
  function openEdit(p) {
    setErr(''); setOkMsg('');
    var used = {};   // 全局 used：box_item_id，避免兜底匹配重复占用同一箱内行
    function findInvByCode(code){
      return matchBoxByCode(code);
    }
    var fboxes = (p.boxes||[]).map(function(b){
      var cartonCode = b.box_code || '';
      var groups = {};   // box_code -> { box_code, items:{} }
      var order = [];
      (b.items||[]).forEach(function(it){
        var srcCode = it.box_code || cartonCode || '';
        if (!groups[srcCode]) { groups[srcCode] = { box_code: srcCode, items:{} }; order.push(srcCode); }
        var g = groups[srcCode];
        var inv = findInvByCode(srcCode);
        var key = null;
        if (it.box_item_id !== undefined && it.box_item_id !== null && inv && inv.items) {
          for (var j=0;j<inv.items.length;j++){ if (String(inv.items[j].id) === String(it.box_item_id)){ key = String(inv.items[j].id); break; } }
        }
        if (key === null && inv && inv.items) {
          for (var j2=0;j2<inv.items.length;j2++){
            var cand = inv.items[j2]; var ck = String(cand.id);
            if ((cand.product_model||'') === (it.product_model||'') && !used[ck]) { key = ck; break; }
          }
        }
        if (key === null) { key = 'orphan_'+it.id; }
        used[key] = true;
        g.items[key] = { model: it.product_model, qty: it.quantity };
      });
      var sources = order.map(function(code){
        var inv = findInvByCode(code);
        return { sid: 's'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
                 box_id: inv ? String(inv.id) : '', box_code: dispCode(code), items: groups[code].items };
      });
      if (!sources.length) sources = [ newFormSource() ];
      return { key:'b'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
               outer_code: b.outer_code || '',
               filename: b.filename || '', original_name: b.original_name || '',
               fileLabel: b.original_name || (b.filename ? T.fileChosen : ''), sources: sources, _existing:true };
    });
    setForm({ id: p.id, plan_date: p.plan_date || '', station: p.station || '', remark: p.remark || '',
              newFiles: [], existingFiles: (p.files || []),
              boxes: fboxes.length ? fboxes : [ newFormBox() ] });
  }

  function updForm(k, v) { setForm(function(p){ var o={}; for(var kk in p) o[kk]=p[kk]; o[k]=v; return o; }); }
  function updBox(idx, patch) {
    setForm(function(p){
      var boxes = p.boxes.slice();
      var nb = {}; for (var k in boxes[idx]) nb[k]=boxes[idx][k]; for (var k2 in patch) nb[k2]=patch[k2];
      boxes[idx] = nb;
      var o={}; for(var kk in p) o[kk]=p[kk]; o.boxes=boxes; return o;
    });
  }
  function addFormBox() { setForm(function(p){ var o={}; for(var k in p) o[k]=p[k]; o.boxes=p.boxes.concat([newFormBox()]); return o; }); }
  function removeFormBox(idx) {
    setForm(function(p){ var bs=p.boxes.slice(); bs.splice(idx,1); if(!bs.length) bs=[newFormBox()]; var o={}; for(var k in p) o[k]=p[k]; o.boxes=bs; return o; });
  }

  // 更新某个发货箱内某个来源箱唛的属性（box_id / box_code / items ...）
  function updSource(idx, sIdx, patch) {
    setForm(function(p){
      var boxes = p.boxes.slice();
      var nb = {}; for (var k in boxes[idx]) nb[k]=boxes[idx][k];
      var srcs = (nb.sources||[]).slice();
      var ns = {}; for (var k2 in srcs[sIdx]) ns[k2]=srcs[sIdx][k2]; for (var k3 in patch) ns[k3]=patch[k3];
      srcs[sIdx] = ns; nb.sources = srcs; boxes[idx]=nb;
      var o={}; for(var kk in p) o[kk]=p[kk]; o.boxes=boxes; return o;
    });
  }
  function addFormSource(idx) {
    setForm(function(p){
      var boxes = p.boxes.slice();
      var nb = {}; for (var k in boxes[idx]) nb[k]=boxes[idx][k];
      nb.sources = (nb.sources||[]).concat([newFormSource()]); boxes[idx]=nb;
      var o={}; for(var kk in p) o[kk]=p[kk]; o.boxes=boxes; return o;
    });
  }
  function removeFormSource(idx, sIdx) {
    setForm(function(p){
      var boxes = p.boxes.slice();
      var nb = {}; for (var k in boxes[idx]) nb[k]=boxes[idx][k];
      var srcs = (nb.sources||[]).slice(); srcs.splice(sIdx,1); if(!srcs.length) srcs=[newFormSource()];
      nb.sources = srcs; boxes[idx]=nb;
      var o={}; for(var kk in p) o[kk]=p[kk]; o.boxes=boxes; return o;
    });
  }

  // 选中来源箱唛编码后，加载该来源箱的型号列表
  function pickSourceBox(idx, sIdx, boxId) {
    var b = null;
    for (var i=0;i<boxesInv.length;i++){ if (String(boxesInv[i].id) === String(boxId)) { b = boxesInv[i]; break; } }
    updSource(idx, sIdx, { box_id: boxId ? Number(boxId) : '', box_code: b ? b.box_code : '', items: {} });
  }

  // 送仓文件：表单里暂存待上传（保存计划后统一上传）
  function addStagedFiles(fileList) {
    if (!fileList || !fileList.length) return;
    // 必须立刻拷成真正的数组：调用方随后会清空 input.value，FileList 是实时的，延后读取会变空
    var picked = Array.prototype.slice.call(fileList);
    setForm(function(p){
      var o={}; for(var k in p) o[k]=p[k];
      o.newFiles = (p.newFiles||[]).concat(picked);
      return o;
    });
  }
  function removeStagedFile(i) {
    setForm(function(p){
      var o={}; for(var k in p) o[k]=p[k];
      var arr = (p.newFiles||[]).slice(); arr.splice(i,1); o.newFiles = arr; return o;
    });
  }
  // 下载计划级送仓文件
  function downloadPlanFile(planId, fileRec) {
    authFetch(API+'/delivery/plans/'+planId+'/files/'+fileRec.id+'/download').then(function(r){
      if (!r.ok) throw new Error('fail');
      return r.blob();
    }).then(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileRec.original_name || fileRec.filename || 'file';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }).catch(function(){ setErr(T.opErr); });
  }

  // 收集表单 → 提交
  function buildPayload() {
    var boxes = [];
    (form.boxes||[]).forEach(function(b){
      var items = [];
      var boxIds = []; var codes = {};
      (b.sources||[]).forEach(function(src){
        if (src.box_id) { var nbid = Number(src.box_id); if (boxIds.indexOf(nbid) < 0) boxIds.push(nbid); }
        if (src.box_code) codes[src.box_code] = 1;
        for (var key in src.items) {
          var e = src.items[key];
          var q = parseInt(e && e.qty, 10) || 0;
          if (q > 0) items.push({ product_model: (e && e.model) || '', quantity: q,
                                  box_item_id: (parseInt(key, 10) || null), box_code: src.box_code || '' });
        }
      });
      if (!items.length) return;
      boxes.push({ box_id: boxIds.length ? boxIds[0] : null, box_code: Object.keys(codes).join('、'),
                   outer_code: b.outer_code || '',
                   filename: '', original_name: '', items: items });
    });
    return { plan_date: form.plan_date || '', station: form.station || '', remark: form.remark || '', boxes: boxes };
  }

  // 保存后上传暂存的送仓文件（支持多个）
  function uploadStagedFiles(planId, files, cb) {
    if (!files || !files.length) { cb(); return; }
    var fd = new FormData();
    files.forEach(function(f){ fd.append('files', f); });
    authFetch(API+'/delivery/plans/'+planId+'/files', {method:'POST', body:fd})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){ cb(r.status === 200 ? null : ((r.data && r.data.detail) || T.opErr)); })
      .catch(function(){ cb(T.netErr); });
  }

  function submitForm() {
    if (!form) return;
    if (!form.station) { setErr(T.needStation); return; }
    var payload = buildPayload();
    if (!payload.boxes.length) { setErr(T.needBox); return; }
    // 必填校验：每个箱子的外箱编码
    for (var bi = 0; bi < payload.boxes.length; bi++) {
      if (!(payload.boxes[bi].outer_code || '').trim()) { setErr(T.needOuterCode); return; }
    }
    // 必填校验：至少要有一个送仓文件（已有的或新选的）
    var hasFiles = ((form.newFiles || []).length + (form.existingFiles || []).length) > 0;
    if (!hasFiles) { setErr(T.needFiles); return; }
    setBusy(true); setErr('');
    var url = form.id ? (API+'/delivery/plans/'+form.id+'/update') : (API+'/delivery/plans');
    authFetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        if (r.status === 200 && r.data && r.data.status === 'success') {
          var pid = r.data.id || form.id;
          uploadStagedFiles(pid, form.newFiles, function(fileErr){
            setBusy(false);
            if (fileErr) { setErr(T.updateOk + ' · ' + T.filesTitle + ': ' + fileErr); load(); return; }
            setOkMsg(form.id ? T.updateOk : T.createOk);
            setForm(null); load();
          });
        } else { setBusy(false); setErr((r.data && r.data.detail) || T.opErr); }
      }).catch(function(){ setBusy(false); setErr(T.netErr); });
  }

  // 查看清单
  function openDetail(p) {
    authFetch(API+'/delivery/plans/'+p.id).then(function(r){return r.json();}).then(function(d){
      if (d && d.plan) setDetail(d.plan);
    }).catch(function(){ setErr(T.loadErr); });
  }

  // 确认出库
  function doOutbound() {
    if (!outboundTarget) return;
    var p = outboundTarget;
    setBusy(true); setErr('');
    authFetch(API+'/delivery/plans/'+p.id+'/outbound', {method:'POST'})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        setBusy(false); setOutboundTarget(null);
        if (r.status === 200 && r.data && r.data.status === 'success') { setOkMsg(T.outboundOk); load(); loadBoxes(); }
        else { setErr((r.data && r.data.detail) || T.opErr); }
      }).catch(function(){ setBusy(false); setOutboundTarget(null); setErr(T.netErr); });
  }

  // 删除
  function doDelete() {
    if (!deleteTarget) return;
    var p = deleteTarget;
    setBusy(true); setErr('');
    authFetch(API+'/delivery/plans/'+p.id+'/delete', {method:'POST'})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        setBusy(false); setDeleteTarget(null);
        if (r.status === 200 && r.data && r.data.status === 'success') { setOkMsg(T.deleteOk); load(); }
        else { setErr((r.data && r.data.detail) || T.opErr); }
      }).catch(function(){ setBusy(false); setDeleteTarget(null); setErr(T.netErr); });
  }

  function statusTag(s) {
    var done = (s === '已完成');
    return h('span',{style:{padding:'2px 8px',borderRadius:10,fontSize:12,fontWeight:600,
      background: done?'#f6ffed':'#e6f4ff', color: done?'#389e0d':'#0958d9',
      border:'1px solid '+(done?'#b7eb8f':'#91caff')}}, done?T.statusDone:T.statusPending);
  }

  // ── 表单：单个「来源箱唛」区块（选箱唛 + 勾型号数量）──
  function renderFormSource(b, idx, src, sIdx) {
    var inv = null;
    for (var i=0;i<boxesInv.length;i++){ if (String(boxesInv[i].id) === String(src.box_id)) { inv = boxesInv[i]; break; } }
    var modelRows = [];
    var renderedKeys = {};
    if (inv && inv.items && inv.items.length) {
      // 每一行箱内明细（每一包）独立勾选：选中 key = 箱内明细行 id，同型号多包互不联动
      modelRows = inv.items.map(function(it){
        var iid = String(it.id);
        renderedKeys[iid] = true;
        var m = it.product_model;
        var sel = src.items[iid];
        var checked = (sel !== undefined);
        var avail = it.quantity || 0;
        return h('div',{key:iid, style:{display:'flex',alignItems:'center',gap:10,padding:'4px 0'}},
          h('input',{type:'checkbox', checked:checked, style:{cursor:'pointer'},
            onChange:function(e){
              var items = {}; for (var k in src.items) items[k]=src.items[k];
              if (e.target.checked) items[iid] = { model: m, qty: '' };
              else delete items[iid];
              updSource(idx, sIdx, {items:items});
            }}),
          h('span',{style:{fontFamily:'monospace',fontSize:13,minWidth:120}}, m),
          h('span',{style:{fontSize:12,color:'#999'}}, '库存 '+avail),
          checked ? h('input',{type:'number',min:1,max:avail,value:sel.qty,
            placeholder:'0', className:'param-input',
            style:{width:'90px',textAlign:'center'},
            onChange:function(e){
              var items={}; for(var k in src.items) items[k]=src.items[k];
              items[iid] = { model: m, qty: e.target.value }; updSource(idx, sIdx, {items:items});
            }}) : null
        );
      });
    }
    // 残留项：箱内行已被删除但计划里仍保存的选中项（编辑旧数据时避免丢失）
    for (var ok in src.items) {
      if (renderedKeys[ok]) continue;
      (function(okey){
        var sel = src.items[okey];
        modelRows.push(h('div',{key:okey, style:{display:'flex',alignItems:'center',gap:10,padding:'4px 0',color:'#fa8c16'}},
          h('input',{type:'checkbox', checked:true, style:{cursor:'pointer'},
            onChange:function(e){
              if (!e.target.checked){ var items={}; for(var k in src.items) items[k]=src.items[k]; delete items[okey]; updSource(idx, sIdx, {items:items}); }
            }}),
          h('span',{style:{fontFamily:'monospace',fontSize:13,minWidth:120}}, (sel&&sel.model)||''),
          h('span',{style:{fontSize:12,color:'#fa8c16'}}, '⚠ 原箱内行已删除'),
          h('input',{type:'number',min:1,value:sel.qty,className:'param-input',style:{width:'90px',textAlign:'center'},
            onChange:function(e){
              var items={}; for(var k in src.items) items[k]=src.items[k];
              items[okey] = { model:(sel&&sel.model)||'', qty: e.target.value }; updSource(idx, sIdx, {items:items});
            }})
        ));
      })(ok);
    }
    if (!modelRows.length && src.box_id) {
      modelRows = [ h('div',{style:{fontSize:13,color:'#bbb',padding:'4px 0'}}, T.noBoxModels) ];
    }
    var showRemoveSrc = ((b.sources||[]).length > 1);
    return h('div',{key:src.sid, style:{border:'1px dashed #d6e4ff',borderRadius:8,padding:'10px',marginBottom:10,background:'#f7faff'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:8,flexWrap:'wrap'}},
        h('span',{style:{fontSize:12,fontWeight:700,color:'#0958d9'}}, T.sourceLabel),
        h('div',{style:{flex:'1 1 240px',minWidth:'180px'}},
          h('input',{className:'param-input',type:'text', list:'dl-'+src.sid, style:{textAlign:'left'},
            value: src.box_code || '', placeholder: T.phSourceBox+' · '+T.pickBoxHint,
            onChange:function(e){
              var val = e.target.value;
              if (val === '') { updSource(idx, sIdx, {box_id:'', box_code:'', items:{}}); return; }
              var mm = matchBoxByCode(val);
              if (mm) {
                // 匹配成功：用库存里的规范编码（空白折叠为单空格），避免换行符导致显示/匹配不一致
                var canon = dispCode(mm.box_code);
                if (String(mm.id) !== String(src.box_id)) updSource(idx, sIdx, {box_id:String(mm.id), box_code:canon, items:{}});
                else updSource(idx, sIdx, {box_code:canon});
              } else {
                // 部分输入/未匹配：只更新文本，保留已选型号与 box_id，避免打字过程中丢失
                updSource(idx, sIdx, {box_code:val});
              }
            }}),
          h('datalist',{id:'dl-'+src.sid}, boxesInv.map(function(bx){
            return h('option',{key:bx.id, value:dispCode(bx.box_code)});
          }))
        ),
        showRemoveSrc ? h('span',{title:T.removeSource,style:{cursor:'pointer',color:'#ff4d4f',fontWeight:700},
          onClick:function(){ removeFormSource(idx, sIdx); }},'✕') : null
      ),
      h('div',null, modelRows)
    );
  }

  // ── 表单里的「发货箱编辑行」：一个发货箱可含多个来源箱唛 ──
  function renderFormBox(b, idx) {
    return h('div',{key:b.key, style:{border:'1px solid #eef0f3',borderRadius:8,padding:'12px',marginBottom:12,background:'#fafcff'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}},
        h('span',{style:{fontWeight:700,fontSize:13,color:'#1677ff'}}, T.cartonLabel(idx+1)),
        h('span',{style:{flex:'1 1 auto',fontSize:12,color:'#999'}}, T.modelsTitle),
        h('span',{className:'inv-del',title:T.removeBox,style:{cursor:'pointer',color:'#ff4d4f',fontWeight:700},
          onClick:function(){ removeFormBox(idx); }},'✕')
      ),
      h('div',{style:{marginBottom:10}},
        h('div',{className:'param-label'}, T.outerCode, h('span',{style:{color:'#ff4d4f',marginLeft:2}},'*')),
        h('input',{className:'param-input',type:'text',style:{textAlign:'left'},value:b.outer_code||'',
          placeholder:T.phOuterCode,
          onChange:function(e){ updBox(idx,{outer_code:e.target.value}); }})
      ),
      (b.sources||[]).map(function(src, sIdx){ return renderFormSource(b, idx, src, sIdx); }),
      h('button',{className:'btn btn-ghost',style:{fontSize:12,padding:'4px 10px',marginTop:2},onClick:function(){ addFormSource(idx); }}, T.addSourceBtn)
    );
  }

  return h('div',null,
    h('div',{className:'card'},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}},
        h('div',null,
          h('div',{style:{fontSize:16,fontWeight:700}}, T.title),
          h('div',{style:{fontSize:12,color:'#999',marginTop:2}}, T.sub)
        ),
        h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
          h('button',{className:'btn btn-ghost',style:{padding:'6px 12px',fontSize:12},onClick:function(){ setL(lang==='zh'?'ru':'zh'); }}, lang==='zh'?'Русский':'中文'),
          h('button',{className:'btn btn-primary',style:{padding:'6px 14px',fontSize:13},onClick:openCreate}, T.createBtn)
        )
      ),
      err ? h('div',{style:{color:'#ff4d4f',fontSize:13,fontWeight:600,marginBottom:10}}, err) : null,
      okMsg ? h('div',{style:{color:'#52c41a',fontSize:13,fontWeight:600,marginBottom:10}}, okMsg) : null,
      (loading ? h('div',{style:{color:'#999',fontSize:13}}, T.loading)
        : (!plans.length ? h('div',{style:{color:'#999',fontSize:14,padding:'12px 0',textAlign:'center'}}, T.noData)
          : h('div',{style:{overflowX:'auto'}},
              h('table',{className:'inv-table'},
                h('thead',null, h('tr',null,
                  h('th',{className:'inv-th'},T.colDate), h('th',{className:'inv-th'},T.colStation),
                  h('th',{className:'inv-th'},T.colBoxes), h('th',{className:'inv-th'},T.colQty),
                  h('th',{className:'inv-th'},T.colRemark), h('th',{className:'inv-th'},T.colStatus),
                  h('th',{className:'inv-th'},T.colCreated), h('th',{className:'inv-th'},T.colAction)
                )),
                h('tbody',null, plans.map(function(p){
                  var done = (p.status === '已完成');
                  return h('tr',{key:p.id},
                    h('td',{style:{whiteSpace:'nowrap'}}, p.plan_date || '—'),
                    h('td',null, p.station || '—'),
                    h('td',{style:{textAlign:'center'}}, p.box_count),
                    h('td',{style:{textAlign:'center',fontWeight:600}}, p.total_qty),
                    h('td',{style:{color:'#888',fontSize:13,maxWidth:'160px',overflow:'hidden',textOverflow:'ellipsis'}}, p.remark || '—'),
                    h('td',null, statusTag(p.status)),
                    h('td',{style:{fontSize:12,color:'#999',whiteSpace:'nowrap'}}, (p.created_at||'').slice(0,10)),
                    h('td',{style:{whiteSpace:'nowrap'}},
                      h('span',{style:{cursor:'pointer',color:'#1677ff',fontSize:13,marginRight:10},title:T.viewHint,onClick:function(){ openDetail(p); }}, '👁'),
                      !done ? h('span',{style:{cursor:'pointer',color:'#1677ff',fontSize:13,marginRight:10},title:T.editHint,onClick:function(){ openEdit(p); }}, '✎') : null,
                      !done ? h('span',{style:{cursor:'pointer',color:'#ff4d4f',fontSize:13,marginRight:10},title:T.deleteHint,onClick:function(){ setErr('');setOkMsg('');setDeleteTarget(p); }}, '🗑') : null,
                      !done ? h('button',{className:'btn btn-success',style:{padding:'3px 10px',fontSize:12},onClick:function(){ setErr('');setOkMsg('');setOutboundTarget(p); }}, T.outboundBtn) : null
                    )
                  );
                }))
              )
            )
        )
      )
    ),

    // ── 创建/编辑表单弹窗 ──
    form ? h('div',{className:'modal-overlay',onClick:function(){ if(!busy) setForm(null); }},
      h('div',{className:'modal-box',style:{width:'720px',maxWidth:'96vw',maxHeight:'88vh',overflowY:'auto'},onClick:function(e){ e.stopPropagation(); }},
        h('div',{className:'modal-title'}, form.id ? T.formTitleEdit : T.formTitleNew),
        h('div',{style:{display:'flex',gap:12,flexWrap:'wrap',marginBottom:14}},
          h('div',{style:{flex:'1 1 200px'}},
            h('div',{className:'param-label'}, T.planDate),
            h('input',{type:'date',className:'param-input',style:{textAlign:'left'},value:form.plan_date,
              onChange:function(e){ updForm('plan_date', e.target.value); }})
          ),
          h('div',{style:{flex:'1 1 200px'}},
            h('div',{className:'param-label'}, T.station),
            h('select',{className:'param-input',style:{textAlign:'left'},value:form.station,
              onChange:function(e){ updForm('station', e.target.value); }},
              h('option',{value:''}, '— '+T.station+' —'),
              h('option',{value:'仓库'}, T.stationWarehouse),
              h('option',{value:'站点'}, T.stationStation)
            )
          )
        ),
        h('div',{style:{marginBottom:14}},
          h('div',{className:'param-label'}, T.remark),
          h('input',{className:'param-input',style:{textAlign:'left'},value:form.remark,placeholder:T.phRemark,
            onChange:function(e){ updForm('remark', e.target.value); }})
        ),
        h('div',{style:{fontWeight:700,fontSize:14,marginBottom:8}}, T.boxesTitle),
        (form.boxes||[]).map(function(b, idx){ return renderFormBox(b, idx); }),
        h('button',{className:'btn btn-ghost',style:{fontSize:13,padding:'6px 12px'},onClick:addFormBox}, T.addBoxBtn),
        h('div',{style:{marginTop:16,borderTop:'1px solid #eef0f3',paddingTop:12}},
          h('div',{style:{fontWeight:700,fontSize:14,marginBottom:8}}, T.filesTitle, h('span',{style:{color:'#ff4d4f',marginLeft:2}},'*')),
          (form.existingFiles||[]).length ? h('div',{style:{marginBottom:8,display:'flex',flexWrap:'wrap',gap:'6px 14px'}},
            form.existingFiles.map(function(f){
              return h('span',{key:'ef_'+f.id,style:{fontSize:12,color:'#389e0d',cursor:'pointer'},
                title:T.filesDl, onClick:function(){ downloadPlanFile(form.id,f); }}, '⬇ '+(f.original_name||f.filename));
            })
          ) : null,
          (form.newFiles||[]).length ? h('div',{style:{marginBottom:8,display:'flex',flexWrap:'wrap',gap:'6px 14px'}},
            form.newFiles.map(function(f,i){
              return h('span',{key:'nf_'+i,style:{fontSize:12,color:'#0958d9'}},
                '📎 '+(f.name||'file'),
                h('span',{style:{cursor:'pointer',color:'#ff4d4f',marginLeft:6,fontWeight:700},title:T.removeBox,
                  onClick:function(){ removeStagedFile(i); }}, '✕'));
            })
          ) : null,
          h('div',{style:{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}},
            h('label',{className:'btn btn-ghost',style:{fontSize:12,padding:'4px 10px',cursor:'pointer'}},
              T.addFilesBtn,
              h('input',{type:'file',multiple:true,style:{display:'none'},
                onChange:function(e){ addStagedFiles(e.target.files); e.target.value=''; }})
            ),
            h('span',{style:{fontSize:12,color:'#999'}}, T.filesHint)
          )
        ),
        err ? h('div',{style:{color:'#ff4d4f',fontSize:13,fontWeight:600,marginTop:10}}, err) : null,
        h('div',{className:'modal-actions'},
          h('button',{className:'btn btn-ghost',onClick:function(){ if(!busy) setForm(null); }}, T.cancelBtn),
          h('button',{className:'btn btn-primary',disabled:busy,onClick:submitForm}, busy?T.saving:T.submitBtn)
        )
      )
    ) : null,

    // ── 查看清单弹窗 ──
    detail ? h('div',{className:'modal-overlay',onClick:function(){ setDetail(null); }},
      h('div',{className:'modal-box',style:{width:'680px',maxWidth:'94vw',maxHeight:'84vh',overflowY:'auto'},onClick:function(e){ e.stopPropagation(); }},
        h('div',{className:'modal-title'}, T.detailTitle(detail.id)),
        h('div',{style:{fontSize:13,color:'#888',marginBottom:6}}, T.detailSub(detail.plan_date||'—', detail.station||'—')),
        detail.remark ? h('div',{style:{fontSize:13,color:'#666',marginBottom:10}}, '📝 '+detail.remark) : null,
        h('div',{style:{marginBottom:10}}, statusTag(detail.status)),
        (detail.boxes||[]).map(function(bx, bIdx){
          // 一个发货箱可按来源箱唛分组展示（同一发货箱可来自多个箱唛）
          var groupsBy = {}; var gOrder = [];
          (bx.items||[]).forEach(function(it){
            var code = it.box_code || bx.box_code || '—';
            if (!groupsBy[code]) { groupsBy[code] = []; gOrder.push(code); }
            groupsBy[code].push(it);
          });
          return h('div',{key:bx.id,style:{border:'1px solid #eef0f3',borderRadius:8,padding:'10px 12px',marginBottom:10,background:'#fafcff'}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8,marginBottom:6}},
              h('span',{style:{fontWeight:700,fontSize:14,color:'#1677ff'}}, T.cartonLabel(bIdx+1)),
              bx.outer_code ? h('span',{style:{fontSize:12,color:'#666'}}, T.outerCode+'：'+bx.outer_code) : null,
              h('div',{style:{display:'flex',gap:12,alignItems:'center'}},
                h('span',{style:{fontSize:13,color:'#1677ff',fontWeight:600}}, T.boxSubtotal(bx.total_qty))
              )
            ),
            gOrder.map(function(code){
              return h('div',{key:'g_'+code, style:{marginBottom:4}},
                h('div',{style:{fontSize:12,color:'#0958d9',fontWeight:600,marginBottom:4}}, '📦 '+T.sourceLabel+' '+code),
                h('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px 10px'}},
                  groupsBy[code].map(function(it){
                    return h('span',{key:it.id,style:{fontSize:12,fontFamily:'monospace',background:'#f0f4fa',borderRadius:6,padding:'2px 8px',color:'#555'}},
                      (it.product_model||'') + ' ×' + (it.quantity||0));
                  })
                )
              );
            })
          );
        }),
        h('div',{style:{marginTop:6,borderTop:'1px solid #eef0f3',paddingTop:10}},
          h('div',{style:{fontWeight:700,fontSize:14,marginBottom:8}}, T.filesTitle),
          (detail.files||[]).length
            ? h('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px 16px'}},
                detail.files.map(function(f){
                  return h('span',{key:'df_'+f.id,style:{cursor:'pointer',color:'#389e0d',fontSize:13},title:T.filesDl,
                    onClick:function(){ downloadPlanFile(detail.id, f); }}, '⬇ '+(f.original_name||f.filename));
                }))
            : h('div',{style:{fontSize:12,color:'#bbb'}}, T.noFilesYet)
        ),
        h('div',{className:'modal-actions'},
          h('button',{className:'btn btn-ghost',onClick:function(){ setDetail(null); }}, T.closeBtn)
        )
      )
    ) : null,

    // ── 确认出库弹窗 ──
    outboundTarget ? h('div',{className:'modal-overlay',onClick:function(){ if(!busy) setOutboundTarget(null); }},
      h('div',{className:'modal-box',onClick:function(e){ e.stopPropagation(); }},
        h('div',{className:'modal-title'}, '⚠️ '+T.outboundTitle),
        h('div',{style:{fontSize:14,lineHeight:1.7,color:'#555'}}, T.outboundMsg(outboundTarget.id)),
        err ? h('div',{style:{color:'#ff4d4f',fontSize:13,fontWeight:600,marginTop:10}}, err) : null,
        h('div',{className:'modal-actions'},
          h('button',{className:'btn btn-ghost',onClick:function(){ if(!busy) setOutboundTarget(null); }}, T.cancel),
          h('button',{className:'btn btn-primary',disabled:busy,onClick:doOutbound}, busy?'…':T.outboundYes)
        )
      )
    ) : null,

    // ── 删除确认弹窗 ──
    deleteTarget ? h('div',{className:'modal-overlay',onClick:function(){ if(!busy) setDeleteTarget(null); }},
      h('div',{className:'modal-box',onClick:function(e){ e.stopPropagation(); }},
        h('div',{className:'modal-title'}, '🗑 '+T.deleteTitle),
        h('div',{style:{fontSize:14,lineHeight:1.7,color:'#555'}}, T.deleteMsg(deleteTarget.id)),
        err ? h('div',{style:{color:'#ff4d4f',fontSize:13,fontWeight:600,marginTop:10}}, err) : null,
        h('div',{className:'modal-actions'},
          h('button',{className:'btn btn-ghost',onClick:function(){ if(!busy) setDeleteTarget(null); }}, T.cancel),
          h('button',{className:'btn btn-primary',style:{background:'#ff4d4f'},disabled:busy,onClick:doDelete}, busy?'…':T.deleteYes)
        )
      )
    ) : null
  );
}

function Page(props) {
  function doLogout() { localStorage.removeItem('wb_token'); localStorage.removeItem('wb_user'); props.onLogout(); }

  var S1 = useState('inventory'), tab = S1[0], setTab = S1[1];
  var S2 = useState(13), er = S2[0], setEr = S2[1];
  var S3 = useState(8), tr = S3[0], setTr = S3[1];
  var S4 = useState(12), fr = S4[0], setFr = S4[1];
  var SD = useState(0), pendingDelivery = SD[0], setPendingDelivery = SD[1];   // 待送仓计划数（标签角标）

  // 店铺：列表 + 当前选中 + 新增弹窗
  var SS = useState([]), stores = SS[0], setStores = SS[1];
  var SC = useState(localStorage.getItem('wb_store_id') || ''), curStore = SC[0], setCurStore = SC[1];
  var SA = useState(false), showAddStore = SA[0], setShowAddStore = SA[1];
  var SN = useState(''), newStoreName = SN[0], setNewStoreName = SN[1];
  var SE = useState(''), storeErr = SE[0], setStoreErr = SE[1];
  var SB = useState(false), storeBusy = SB[0], setStoreBusy = SB[1];

  function loadStores() {
    authFetch(API+'/stores').then(function(r){return r.json();}).then(function(d){
      var list = (d && d.stores) || [];
      setStores(list);
      var ids = list.map(function(s){ return String(s.id); });
      var cur = localStorage.getItem('wb_store_id');
      if (!cur || ids.indexOf(cur) === -1) {
        var first = list.length ? String(list[0].id) : '1';
        localStorage.setItem('wb_store_id', first);
        setCurStore(first);
      } else { setCurStore(cur); }
    }).catch(function(){});
  }
  useEffect(function(){ loadStores(); }, []);

  // 「送仓计划」标签角标：统计待出库（未完成）计划数
  function loadDeliveryCount() {
    authFetch(API+'/delivery/plans').then(function(r){return r.json();}).then(function(d){
      var n = ((d && d.plans) || []).filter(function(p){ return (p.status||'') !== '已完成'; }).length;
      setPendingDelivery(n);
    }).catch(function(){});
  }
  useEffect(function(){ loadDeliveryCount(); }, [curStore]);

  function changeStore(id) {
    id = String(id);
    localStorage.setItem('wb_store_id', id);
    setCurStore(id);
  }

  function createStore() {
    var name = (newStoreName || '').trim();
    if (!name) { setStoreErr('请输入店铺名'); return; }
    setStoreBusy(true); setStoreErr('');
    authFetch(API+'/stores', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:name})})
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(r){
        setStoreBusy(false);
        if (r.status === 200 && r.data.store) {
          var nid = String(r.data.store.id);
          setShowAddStore(false); setNewStoreName('');
          localStorage.setItem('wb_store_id', nid);
          setCurStore(nid);
          loadStores();
        } else { setStoreErr((r.data && r.data.detail) || '创建失败'); }
      }).catch(function(){ setStoreBusy(false); setStoreErr('网络错误'); });
  }

  var tabs = [
    {key:'inventory', label:'📦 上架库存'},
    {key:'box', label:'🗃 箱子库存'},
    {key:'inbound', label:'🚚 在途库存'},
    {key:'delivery', label:'🚛 送仓计划'},
    {key:'logs', label:'📋 操作日志'},
    {key:'manual', label:'📎 手动处理'},
  ];

  return h('div',null,
    h('div',{className:'header'},
      h('h1',null,'WB系统工具'),
      h('div',{className:'header-right'},
        h('span',{className:'store-label'},'🏬 店铺'),
        h('select',{className:'store-select', value:curStore, onChange:function(e){ changeStore(e.target.value); }},
          stores.length === 0
            ? h('option',{value:curStore||'1'}, '店铺'+(curStore||'1'))
            : stores.map(function(s){ return h('option',{key:s.id, value:String(s.id)}, s.name); })
        ),
        h('span',{className:'store-add',onClick:function(){ setStoreErr(''); setNewStoreName(''); setShowAddStore(true); }},'＋ 新增店铺'),
        h('span',{className:'logout-btn',onClick:doLogout},'退出')
      )
    ),
    h('div',{className:'tab-bar'},
      tabs.map(function(t){
        var badge = (t.key==='delivery' && pendingDelivery>0)
          ? h('span',{className:'tab-badge', title:'待送仓 '+pendingDelivery+' 条'}, pendingDelivery>99 ? '99+' : String(pendingDelivery))
          : null;
        return h('div',{
          key:t.key,
          className:'tab-item'+(tab===t.key?' active':''),
          onClick:function(){setTab(t.key);}
        }, t.label, badge);
      })
    ),
    h('div',{className:'container'},
      tab==='inventory'
        ? h(InventoryTab,{key:'inv-'+curStore})
        : tab==='box'
        ? h(BoxTab,{key:'box-'+curStore, onGotoInbound:function(){ setTab('inbound'); }})
        : tab==='inbound'
        ? h(InboundTab,{key:'inbound-'+curStore})
        : tab==='delivery'
        ? h(DeliveryTab,{key:'delivery-'+curStore, onCount:setPendingDelivery})
        : tab==='logs'
        ? h(LogTab,{key:'logs-'+curStore})
        : h(ManualTab,{key:'manual-'+curStore, er:er,tr:tr,fr:fr,setEr:setEr,setTr:setTr,setFr:setFr})
    ),
    // 新增店铺弹窗
    showAddStore ? h('div',{className:'modal-overlay',onClick:function(){ if(!storeBusy) setShowAddStore(false); }},
      h('div',{className:'modal-box',onClick:function(e){ e.stopPropagation(); }},
        h('div',{className:'modal-title'},'➕ 新增店铺'),
        h('div',{className:'modal-row'},
          h('div',{className:'param-label'},'店铺名称'),
          h('input',{className:'param-input',style:{textAlign:'left'},autoFocus:true,value:newStoreName,placeholder:'如 店铺2',
            onChange:function(e){ setNewStoreName(e.target.value); },
            onKeyDown:function(e){ if(e.key==='Enter') createStore(); }})
        ),
        storeErr ? h('div',{style:{color:'#ff4d4f',fontSize:13,fontWeight:600}},storeErr) : null,
        h('div',{className:'modal-actions'},
          h('button',{className:'btn btn-ghost',onClick:function(){ if(!storeBusy) setShowAddStore(false); }},'取消'),
          h('button',{className:'btn btn-primary',disabled:storeBusy,onClick:createStore}, storeBusy?'…':'创建')
        )
      )
    ) : null
  );
}

function App() {
  var S = useState(null), loggedIn = S[0], setLoggedIn = S[1];
  var S2 = useState(false), checked = S2[0], setChecked = S2[1];

  useEffect(function(){
    var t = localStorage.getItem('wb_token');
    if (t) {
      var hd = {'Authorization':'Bearer '+t};
      fetch(API+'/auth/verify',{headers:hd}).then(function(r){
        if (r.ok) { setLoggedIn(true); } else { localStorage.removeItem('wb_token'); localStorage.removeItem('wb_user'); }
        setChecked(true);
      }).catch(function(){setChecked(true);});
    } else { setChecked(true); }
  }, []);

  if (!checked) return null;
  if (!loggedIn) return h(LoginPage,{onLogin:function(){setLoggedIn(true);}});
  return h(Page,{onLogout:function(){setLoggedIn(false);}});
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
